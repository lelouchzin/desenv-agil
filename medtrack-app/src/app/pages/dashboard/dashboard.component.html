<div class="page">
  <header class="page-header">
    <div>
      <h1>Bom dia, João 👋</h1>
      <p class="sub">{{ hoje | date:'EEEE, d \'de\' MMMM':'':'pt-BR' }}</p>
    </div>
    <a routerLink="/remedios" class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      Ver todos
    </a>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon blue">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      </div>
      <div class="kpi-info">
        <span class="kpi-val">{{ totalAtivos }}</span>
        <span class="kpi-label">Remédios Ativos</span>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="kpi-info">
        <span class="kpi-val">{{ tomadosHoje }}</span>
        <span class="kpi-label">Tomados Hoje</span>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon yellow">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="kpi-info">
        <span class="kpi-val">{{ pendentesHoje }}</span>
        <span class="kpi-label">Pendentes Hoje</span>
      </div>
    </div>
    <div class="kpi-card" [class.alert]="atrasados > 0">
      <div class="kpi-icon red">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="kpi-info">
        <span class="kpi-val">{{ atrasados }}</span>
        <span class="kpi-label">Atrasados</span>
      </div>
    </div>
  </div>
</div>
