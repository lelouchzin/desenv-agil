<div class="page">
  <header class="page-header">
    <div>
      <h1>Meus Remédios</h1>
      <p class="sub">{{ (remedios | filterAtivos) }} ativos de {{ remedios.length }}</p>
    </div>
    <a routerLink="/remedios/novo" class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      Novo Remédio
    </a>
  </header>

  <div class="tabs">
    <button class="tab" [class.active]="filtro === 'todos'" (click)="filtro = 'todos'">Todos</button>
    <button class="tab" [class.active]="filtro === 'ativos'" (click)="filtro = 'ativos'">Ativos</button>
    <button class="tab" [class.active]="filtro === 'inativos'" (click)="filtro = 'inativos'">Inativos</button>
  </div>

  <div class="remedio-grid">
    <div class="remedio-card" *ngFor="let r of remediosFiltrados" [class.inativo]="!r.ativo">
      <div class="card-stripe" [style.background]="r.cor"></div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title">
            <span class="remedio-nome">{{ r.nome }}</span>
            <span class="remedio-dose">{{ r.dosagem }}{{ r.unidade }}</span>
          </div>
          <span class="badge" [class.on]="r.ativo">{{ r.ativo ? 'Ativo' : 'Inativo' }}</span>
        </div>
        <div class="freq">{{ frequenciaLabel(r) }}</div>
        <div class="horarios">
          <span class="horario-chip" *ngFor="let h of r.horarios">{{ h.hora }}</span>
        </div>
        <p class="obs" *ngIf="r.observacoes">{{ r.observacoes }}</p>
      </div>
    </div>
  </div>
</div>
