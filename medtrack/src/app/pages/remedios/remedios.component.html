<div class="remedios">
  <header class="page-header">
    <div>
      <h1>Meus Remédios</h1>
      <p class="subtitle">Gerencie seus medicamentos cadastrados</p>
    </div>
    <button class="btn-novo" (click)="mostrarForm = true" *ngIf="!mostrarForm">
      + Novo Remédio
    </button>
  </header>

  <!-- Formulário -->
  <div class="form-card" *ngIf="mostrarForm">
    <h2>Cadastrar Remédio</h2>

    <div class="form-grid">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" [(ngModel)]="novoRemedio.nome" placeholder="Ex: Losartana" [class.input-erro]="erros.nome" />
        <span class="msg-erro" *ngIf="erros.nome">{{ erros.nome }}</span>
      </div>

      <div class="form-group">
        <label>Dosagem</label>
        <input type="text" [(ngModel)]="novoRemedio.dosagem" placeholder="Ex: 50" [class.input-erro]="erros.dosagem" />
        <span class="msg-erro" *ngIf="erros.dosagem">{{ erros.dosagem }}</span>
      </div>

      <div class="form-group">
        <label>Unidade</label>
        <select [(ngModel)]="novoRemedio.unidade">
          <option value="mg">mg</option>
          <option value="ml">ml</option>
          <option value="UI">UI</option>
          <option value="gotas">gotas</option>
          <option value="comprimido">comprimido</option>
        </select>
      </div>

      <div class="form-group">
        <label>Frequência</label>
        <select [(ngModel)]="novoRemedio.frequencia">
          <option value="diario">Diário</option>
          <option value="semanal">Semanal</option>
          <option value="intervalo">Por intervalo</option>
        </select>
      </div>

      <div class="form-group">
        <label>Horário</label>
        <input type="time" [(ngModel)]="novoRemedio.horarios[0].hora" />
      </div>

      <div class="form-group">
        <label>Data de início</label>
        <input type="date" [(ngModel)]="novoRemedio.dataInicio" />
      </div>
    </div>

    <div class="form-group">
      <label>Observações</label>
      <input type="text" [(ngModel)]="novoRemedio.observacoes" placeholder="Ex: Tomar com água" />
    </div>

    <div class="form-group">
      <label>Cor</label>
      <div class="cores-picker">
        <div
          class="cor-option"
          *ngFor="let cor of cores"
          [style.background]="cor"
          [class.selecionada]="novoRemedio.cor === cor"
          (click)="novoRemedio.cor = cor"
        ></div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button class="btn-salvar" (click)="salvar()">Salvar</button>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros" *ngIf="!mostrarForm">
    <button [class.ativo]="filtro === 'todos'" (click)="filtro = 'todos'">Todos</button>
    <button [class.ativo]="filtro === 'ativos'" (click)="filtro = 'ativos'">Ativos</button>
    <button [class.ativo]="filtro === 'inativos'" (click)="filtro = 'inativos'">Inativos</button>
  </div>

  <!-- Lista -->
  <div class="remedios-list" *ngIf="remedios$ | async as remedios">
    <div
      class="remedio-card"
      *ngFor="let remedio of filtrar(remedios)"
      [class.inativo]="!remedio.ativo"
    >
      <div class="remedio-color" [style.background]="remedio.cor"></div>

      <div class="remedio-info">
        <div class="remedio-header">
          <span class="remedio-nome">{{ remedio.nome }}</span>
          <span class="badge-freq">{{ frequenciaLabel(remedio) }}</span>
        </div>
        <span class="remedio-dosagem">{{ remedio.dosagem }} {{ remedio.unidade }}</span>
        <div class="remedio-horarios">
          <span class="horario-tag" *ngFor="let h of remedio.horarios">{{ h.hora }}</span>
        </div>
        <p class="remedio-obs" *ngIf="remedio.observacoes">{{ remedio.observacoes }}</p>
      </div>

      <div class="remedio-actions">
        <button class="btn-toggle" (click)="toggleAtivo(remedio)">
          {{ remedio.ativo ? 'Desativar' : 'Ativar' }}
        </button>
        <button class="btn-excluir" (click)="excluir(remedio.id)">Excluir</button>
      </div>
    </div>
  </div>
</div>
